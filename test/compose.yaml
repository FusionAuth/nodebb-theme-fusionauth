name: fusionauth-nodebb

services:
  nodebb:
    image: ghcr.io/nodebb/nodebb:4.16.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:4567:4567"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODEBB_ADDITIONAL_PLUGINS: file:/theme
    volumes:
      - ..:/theme:ro
      - nodebb-modules:/usr/src/app/node_modules
      - nodebb-build:/usr/src/app/build
      - nodebb-uploads:/usr/src/app/public/uploads
      - nodebb-config:/opt/config

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis-data:/data

volumes:
  nodebb-modules:
  nodebb-build:
  nodebb-uploads:
  nodebb-config:
  redis-data:
